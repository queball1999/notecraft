[workspace]
resolver = "2"
members = [
    "crates/notecraft-core",
    "crates/notecraft-storage",
    "crates/notecraft-model",
    "crates/notecraft-markdown",
    "crates/notecraft-canvas",
    "crates/notecraft-engine",
    "crates/notecraft-ui-egui",
    "apps/notecraft",
    "apps/notecraft-cli",
    "xtask",
]

[workspace.package]
version = "0.0.0"
edition = "2021"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Queball1999/notecraft"
authors = ["The NoteCraft Contributors"]

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unimplemented = "deny"
todo = "deny"
unreachable = "deny"
indexing_slicing = "warn"

[workspace.dependencies]
notecraft-core = { path = "crates/notecraft-core" }
notecraft-storage = { path = "crates/notecraft-storage" }
notecraft-model = { path = "crates/notecraft-model" }
notecraft-markdown = { path = "crates/notecraft-markdown" }
notecraft-canvas = { path = "crates/notecraft-canvas" }
notecraft-engine = { path = "crates/notecraft-engine" }
notecraft-ui-egui = { path = "crates/notecraft-ui-egui" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = { version = "0.9", default-features = false, features = ["std", "parse", "serde"] }
tempfile = "3"
tracing = "0.1"
# Markdown parser, behind notecraft-markdown. BSD-2-Clause (permissive, compatible with MIT OR Apache-2.0); builds for wasm32.
comrak = { version = "0.56", default-features = false }
# UI stack. Same egui release as craft-libs (egui 0.36).
egui = "0.36"
eframe = { version = "0.36", default-features = false }
egui_kittest = "0.36"
# Same font parser egui uses; checks OS fonts before egui loads them.
skrifa = "0.44"
# Native open dialogs; only the desktop app (L7) uses them.
rfd = "0.15"
image = { version = "0.25", default-features = false, features = ["png"] }
# craft-libs: every crate from one pinned commit (docs/craft-libs.md section 5).
craft-atomic = { git = "https://github.com/storytold/craft-libs", rev = "457a078809690994b22debdffb703ff36d3129df" }
craft-ui = { git = "https://github.com/storytold/craft-libs", rev = "457a078809690994b22debdffb703ff36d3129df" }
craft-quit = { git = "https://github.com/storytold/craft-libs", rev = "457a078809690994b22debdffb703ff36d3129df" }
craft-settings = { git = "https://github.com/storytold/craft-libs", rev = "457a078809690994b22debdffb703ff36d3129df" }
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter", "std", "ansi", "registry"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
